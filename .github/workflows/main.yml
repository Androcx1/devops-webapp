name: Aplicación web DevOps con CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  tests:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Ejecutar cobertura
        run: npm run test:coverage


  docker:
    name: Construir y publicar imagen Docker
    runs-on: ubuntu-latest

    needs: tests

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/webapp:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/webapp:${{ github.sha }}


  deploy:
    name: Desplegar en EC2
    runs-on: ubuntu-latest

    needs: docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Desplegar nueva imagen en EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull androcx1/webapp:latest

            sudo docker stop webapp-container || true
            sudo docker rm webapp-container || true

            mkdir -p /home/ubuntu/webapp-data

            sudo docker run -d \
              -p 8080:80 \
              -p 6061:6061 \
              --restart unless-stopped \
              --name webapp-container \
              -e DB_PATH=/data/database.db \
              -v /home/ubuntu/webapp-data:/data \
              androcx1/webapp:latest

            sudo docker ps